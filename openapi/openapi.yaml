openapi: 3.0.3
info:
  title: Deckwatch API
  description: |
    Kubernetes control-plane and OCI registry surface exposed by Deckwatch.

    - `/api/*` — application, deployment, namespace, and cluster management
    - `/v2/*`  — OCI Distribution Spec v1.1 (only when the embedded registry is enabled)
    - `/metrics` — Prometheus exposition
  # Served with the running deckwatch version (src/handlers/docs.rs).
  version: "0.7.0"
  contact:
    name: Deckwatch
    url: https://github.com/alexconrey/deckwatch

servers:
  - url: /
    description: Same-origin (served by deckwatch)

tags:
  - name: Health
  - name: Namespaces
  - name: Deployments
  - name: Applications
  - name: Pods
  - name: Ingresses
  - name: Secrets
  - name: ConfigMaps
  - name: CronJobs
  - name: Nodes
  - name: Events
  - name: Metrics
  - name: Logs
  - name: Exec
  - name: GitOps
  - name: Git
  - name: Diagnostics
  - name: Templates
  - name: Settings
  - name: Plugins
  - name: Registry
  - name: Audit
  - name: MCP
  - name: OCI

paths:

  # ------------------------------------------------------------------ health
  /api/healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/readyz:
    get:
      tags: [Health]
      summary: Readiness probe (verifies kube API reachability)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready

  # -------------------------------------------------------------- namespaces
  /api/namespaces:
    get:
      tags: [Namespaces]
      summary: List namespaces visible to deckwatch
      responses:
        "200":
          description: Namespaces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceListResponse" }
    post:
      tags: [Namespaces]
      summary: Create a namespace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNamespaceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateNamespaceResponse" }

  # -------------------------------------------------------------- deployments
  /api/namespaces/{ns}/deployments:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [Deployments]
      summary: List deployments in a namespace
      parameters:
        - in: query
          name: label_selector
          required: false
          schema: { type: string }
          description: Kubernetes label selector (e.g. `app=api`)
      responses:
        "200":
          description: Deployments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentListResponse" }
    post:
      tags: [Deployments]
      summary: Create a deployment
      description: |
        Plugins run before the Deployment is created. Their events (warnings
        included, even on success) are returned in `plugin_events`; a failing
        plugin is skipped and never fails the request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeploymentRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentWriteResponse" }

  /api/namespaces/{ns}/deployments/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Deployments]
      summary: Get a deployment with pods and ingresses
      responses:
        "200":
          description: Deployment detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentDetailResponse" }
    put:
      tags: [Deployments]
      summary: Update a deployment (image, replicas, env, resources, probes)
      description: Plugins run on the updated Deployment; see `plugin_events`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeploymentRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentWriteResponse" }
    delete:
      tags: [Deployments]
      summary: Delete a deployment
      responses:
        "204": { description: Deleted }

  /api/namespaces/{ns}/deployments/{name}/yaml:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Deployments]
      summary: Get the raw Deployment manifest as YAML
      responses:
        "200":
          description: YAML manifest
          content:
            application/yaml:
              schema: { type: string }
    put:
      tags: [Deployments]
      summary: Replace the Deployment manifest from YAML
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
      responses:
        "200": { description: Updated }

  /api/namespaces/{ns}/deployments/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Deployments]
      summary: Rolling-restart a deployment
      responses:
        "202": { description: Restart triggered }

  /api/namespaces/{ns}/deployments/{name}/scale:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Deployments]
      summary: Scale a deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replicas]
              properties:
                replicas: { type: integer, minimum: 0 }
      responses:
        "200": { description: Scaled }

  /api/namespaces/{ns}/deployments/{name}/probes:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    patch:
      tags: [Deployments]
      summary: Patch liveness / readiness / startup probes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                liveness_probe:  { $ref: "#/components/schemas/ProbeInput" }
                readiness_probe: { $ref: "#/components/schemas/ProbeInput" }
                startup_probe:   { $ref: "#/components/schemas/ProbeInput" }
      responses:
        "200": { description: Updated }

  /api/namespaces/{ns}/deployments/{name}/containers:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Deployments]
      summary: Add a sidecar container
      responses:
        "200": { description: Container added }

  /api/namespaces/{ns}/deployments/{name}/containers/{container_name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
      - in: path
        name: container_name
        required: true
        schema: { type: string }
    delete:
      tags: [Deployments]
      summary: Remove a sidecar container
      responses:
        "204": { description: Removed }

  /api/namespaces/{ns}/deployments/{name}/pods:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Pods]
      summary: List pods belonging to a deployment
      responses:
        "200":
          description: Pods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodListResponse" }

  /api/namespaces/{ns}/deployments/{name}/history:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Deployments]
      summary: List ReplicaSet revision history for a deployment
      responses: { "200": { description: Revisions } }

  /api/namespaces/{ns}/deployments/{name}/rollback:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Deployments]
      summary: Rollback to a prior revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer }
      responses:
        "202": { description: Rollback triggered }

  /api/namespaces/{ns}/deployments/validate:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [Deployments]
      summary: Dry-run validate a deployment payload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeploymentRequest" }
      responses:
        "200": { description: Valid }
        "400": { description: Invalid }

  /api/namespaces/{ns}/deployments/{name}/clone:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Deployments]
      summary: Clone a deployment (into same or another namespace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_namespace: { type: string }
                target_name:      { type: string }
      responses:
        "201": { description: Cloned }

  # -------------------------------------------------------------- ingresses
  /api/namespaces/{ns}/ingresses:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [Ingresses]
      summary: List ingresses
      responses: { "200": { description: OK } }
    post:
      tags: [Ingresses]
      summary: Create an ingress
      responses: { "201": { description: Created } }
  /api/namespaces/{ns}/ingresses/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Ingresses]
      responses: { "200": { description: OK } }
    put:
      tags: [Ingresses]
      responses: { "200": { description: Updated } }
    delete:
      tags: [Ingresses]
      responses: { "204": { description: Deleted } }

  # -------------------------------------------------------------- gitops
  /api/namespaces/{ns}/deployments/{name}/gitops:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [GitOps]
      summary: Get GitOps config attached to a deployment
      responses:
        "200":
          description: GitOps status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitOpsStatusResponse" }
    put:
      tags: [GitOps]
      summary: Attach or update GitOps config for a deployment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitOpsConfigRequest" }
      responses: { "200": { description: Saved } }
    delete:
      tags: [GitOps]
      summary: Detach GitOps config
      responses: { "204": { description: Detached } }
  /api/namespaces/{ns}/deployments/{name}/gitops/trigger:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    post:
      tags: [GitOps]
      summary: Manually trigger a build (kaniko job)
      responses: { "202": { description: Build queued } }
  /api/namespaces/{ns}/deployments/{name}/gitops/builds:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [GitOps]
      summary: List past kaniko builds for this deployment
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------- pods / logs / exec
  /api/namespaces/{ns}/pods/{pod_name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - in: path
        name: pod_name
        required: true
        schema: { type: string }
    get:
      tags: [Pods]
      summary: Get a pod
      responses:
        "200":
          description: Pod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodSummary" }

  /api/namespaces/{ns}/pods/{pod_name}/logs:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - in: path
        name: pod_name
        required: true
        schema: { type: string }
    get:
      tags: [Logs]
      summary: Stream pod logs (Server-Sent Events)
      parameters:
        - in: query
          name: container
          schema: { type: string }
        - in: query
          name: follow
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /api/namespaces/{ns}/pods/{pod_name}/logs/history:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - in: path
        name: pod_name
        required: true
        schema: { type: string }
    get:
      tags: [Logs]
      summary: Fetch a historical log slice (non-streaming)
      parameters:
        - in: query
          name: container
          schema: { type: string }
        - in: query
          name: tail_lines
          schema: { type: integer }
      responses: { "200": { description: Logs } }

  /api/namespaces/{ns}/pods/{pod_name}/exec:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - in: path
        name: pod_name
        required: true
        schema: { type: string }
    get:
      tags: [Exec]
      summary: Upgrade to a WebSocket TTY exec session
      responses:
        "101": { description: Switching Protocols (WebSocket) }

  /api/namespaces/{ns}/pods/metrics:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [Metrics]
      summary: Per-pod resource metrics (from metrics-server)
      responses: { "200": { description: OK } }

  /api/nodes:
    get:
      tags: [Nodes]
      summary: List cluster nodes
      responses: { "200": { description: Nodes } }
  /api/nodes/metrics:
    get:
      tags: [Metrics]
      summary: Per-node resource metrics
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------- cronjobs
  /api/namespaces/{ns}/cronjobs:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [CronJobs]
      responses: { "200": { description: OK } }
  /api/namespaces/{ns}/cronjobs/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [CronJobs]
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------- templates
  /api/templates:
    get:
      tags: [Templates]
      summary: List deployment templates
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------- diagnostics
  /api/namespaces/{ns}/diagnostics:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    post:
      tags: [Diagnostics]
      summary: Kick off an AI-assisted diagnostic Job
      responses: { "202": { description: Queued } }
  /api/namespaces/{ns}/diagnostics/{job_name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - in: path
        name: job_name
        required: true
        schema: { type: string }
    get:
      tags: [Diagnostics]
      summary: Poll diagnostic Job status
      responses: { "200": { description: OK } }
  /api/namespaces/{ns}/diagnostics/{job_name}/result:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - in: path
        name: job_name
        required: true
        schema: { type: string }
    get:
      tags: [Diagnostics]
      summary: Fetch diagnostic result (once complete)
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------- applications
  /api/namespaces/{ns}/applications:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [Applications]
      summary: List applications
      responses: { "200": { description: OK } }
    post:
      tags: [Applications]
      summary: Create an application (grouping of deployments)
      responses: { "201": { description: Created } }
  /api/namespaces/{ns}/applications/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Applications]
      responses: { "200": { description: OK } }
    put:
      tags: [Applications]
      responses: { "200": { description: OK } }
    delete:
      tags: [Applications]
      responses: { "204": { description: Deleted } }
  /api/namespaces/{ns}/applications/{name}/members:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Applications]
      summary: Add a member resource (deployment / cronjob) to the app
      responses: { "200": { description: OK } }
  /api/namespaces/{ns}/applications/{name}/members/{kind}/{resource_name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [Deployment, CronJob] }
      - in: path
        name: resource_name
        required: true
        schema: { type: string }
    delete:
      tags: [Applications]
      summary: Remove a member from the app
      responses: { "204": { description: Removed } }

  # -------------------------------------------------------------- git
  /api/git/branches:
    get:
      tags: [Git]
      summary: List branches on a remote git repo (auth via configured secret)
      parameters:
        - in: query
          name: repo_url
          required: true
          schema: { type: string }
        - in: query
          name: token_secret
          schema: { type: string }
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------- events
  /api/events:
    get:
      tags: [Events]
      summary: List cluster-wide events
      responses: { "200": { description: OK } }
  /api/namespaces/{ns}/events:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [Events]
      summary: List events in a namespace
      responses: { "200": { description: OK } }

  # -------------------------------------------------------------- secrets / configmaps
  /api/namespaces/{ns}/secrets:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [Secrets]
      responses: { "200": { description: OK } }
    post:
      tags: [Secrets]
      responses: { "201": { description: Created } }
  /api/namespaces/{ns}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Secrets]
      responses: { "200": { description: OK } }
    put:
      tags: [Secrets]
      responses: { "200": { description: OK } }
    delete:
      tags: [Secrets]
      responses: { "204": { description: Deleted } }
  /api/namespaces/{ns}/configmaps:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      tags: [ConfigMaps]
      responses: { "200": { description: OK } }
    post:
      tags: [ConfigMaps]
      responses: { "201": { description: Created } }
  /api/namespaces/{ns}/configmaps/{name}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [ConfigMaps]
      responses: { "200": { description: OK } }
    put:
      tags: [ConfigMaps]
      responses: { "200": { description: OK } }
    delete:
      tags: [ConfigMaps]
      responses: { "204": { description: Deleted } }

  # -------------------------------------------------------------- settings
  /api/settings:
    get:
      tags: [Settings]
      summary: Read deckwatch settings (from ConfigMap)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeckwatchSettings" }
    put:
      tags: [Settings]
      summary: Update deckwatch settings
      description: |
        Secrets come back masked on GET; masked values are restored from the
        stored copy. `credentials` and git token bindings are server-managed
        and ignored here. Omitting `endpoints`, `observability`, `tracing` or
        `mcp_tuning.guardrails` keeps the stored value. Every endpoint change,
        OTLP endpoints included, and every MCP guardrail change is written to
        the audit log.

        A plugin's masked `config` values are restored only while it runs the
        same code: when its `source` changes, or its `sha256` pin changes or is
        removed, they must be entered again (`400` names them). Such changes
        are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeckwatchSettings" }
      responses:
        "200": { description: Updated }
        "400": { description: "Invalid endpoint or OTLP endpoint (scheme, userinfo, query, host) or AI provider region, or a masked plugin value that can't be restored" }

  /api/settings/credentials:
    post:
      tags: [Settings]
      summary: Encrypt and store AI provider credentials
      description: |
        Only the keys present are changed; `""` clears a key. Each saved key
        is bound to the endpoint origins configured at that moment and is
        never sent to any other host. After an endpoint change the key must be
        saved again to be used with the new host.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCredentialsRequest" }
      responses:
        "200":
          description: Masked values and bindings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetCredentialsResponse" }
        "400": { description: "DECKWATCH_ENCRYPTION_KEY unset, or the configured endpoint is invalid" }

  /api/settings/outbound:
    get:
      tags: [Settings]
      summary: Endpoint defaults, credential bindings and outbound TLS policy
      description: |
        For the Settings page: every configurable endpoint with its default
        and effective value, each stored credential with the hosts it is bound
        to (and whether they still match), whether
        `DECKWATCH_ALLOW_INSECURE_ENDPOINTS` is set, and the extra CA bundle
        from `DECKWATCH_EXTRA_CA_FILE`. See docs/TLS.md.
      responses:
        "200":
          description: Outbound status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboundStatus" }

  /api/settings/observability:
    get:
      tags: [Settings]
      summary: Where deckwatch's own telemetry goes, now and after a restart
      description: |
        For each signal (traces, metrics, logs): the endpoint deckwatch exports
        it to now, as set up at startup (`running`), and the one the
        environment and the saved settings ask for, which applies from the
        next start (`configured`). Per signal, an
        `OTEL_EXPORTER_OTLP_*ENDPOINT` variable wins over the settings.
        `retired_otlp_endpoint` is set while the retired
        `tracing.otlp_endpoint` is set and `observability.otlp_endpoint`
        isn't. See docs/TRACING.md, "deckwatch's own telemetry".
      responses:
        "200":
          description: Export status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservabilityStatus" }

  # ------------------------------------------- plugin-provisioned resources
  /api/namespaces/{ns}/applications/{name}/resources:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Plugins]
      summary: List an application's plugin-provisioned resources
      responses:
        "200":
          description: Provisioned resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProvisionedResource" }

  /api/namespaces/{ns}/applications/{name}/resources/{plugin}/{resource_id}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
      - in: path
        name: plugin
        required: true
        schema: { type: string }
        description: Configured plugin name
      - in: path
        name: resource_id
        required: true
        schema: { type: string }
        description: A resource id the plugin declares in `metadata().resources`
    post:
      tags: [Plugins]
      summary: Provision a resource through its plugin
      description: |
        Calls the plugin's `provision()` and stores the result. What the plugin
        reported (warnings included) is returned in `plugin_events`. If the call
        fails outright, nothing is stored and the reply is 502 with the events.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionRequest" }
      responses:
        "201":
          description: Provisioned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedResource" }
        "502":
          description: The plugin call failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginFailedError" }
    patch:
      tags: [Plugins]
      summary: Re-run provision() with the stored fields and update the record
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisionedResource" }
        "502":
          description: The plugin call failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PluginFailedError" }
    delete:
      tags: [Plugins]
      summary: Deprovision a resource and remove its record
      description: |
        Calls the plugin's `deprovision()` (if it has one), then removes the
        record whatever the outcome. Returns the plugin's message about what it
        did and didn't clean up, and its events.
      responses:
        "200":
          description: Record removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeprovisionResponse" }

  # ----------------------------------------------------------- plugin status
  /api/plugin-status:
    get:
      tags: [Plugins]
      summary: Current state of every plugin call target
      description: |
        One row per target: a provisioned resource, a plugin's `apply()` for an
        application (`resource_id` empty), or the plugin itself (`namespace`
        and `application` empty; fetch and load). Current state only: the
        latest events, not a history. Most severe first, then most recently
        updated. Rows in namespaces outside the allowlist are omitted.
      parameters:
        - in: query
          name: health
          required: false
          schema: { type: string }
          description: Comma-separated healths to include, e.g. `failing,degraded`
        - in: query
          name: plugin
          required: false
          schema: { type: string }
        - in: query
          name: namespace
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Plugin status rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PluginStatus" }

  /api/namespaces/{ns}/applications/{name}/plugin-status:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Plugins]
      summary: Plugin status rows for one application
      responses:
        "200":
          description: Plugin status rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PluginStatus" }

  /api/plugins/{name}/status:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
        description: Configured plugin name
    get:
      tags: [Plugins]
      summary: Plugin status rows for one plugin, its load included
      responses:
        "200":
          description: Plugin status rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PluginStatus" }

  # -------------------------------------------------------------- plugins
  /api/plugins:
    get:
      tags: [Plugins]
      summary: List loaded WASM plugins
      description: |
        Returns every plugin currently loaded in memory. Configured-but-not-loaded
        plugins (disabled, fetch failed, version incompatible) are omitted.

        `version` is self-reported by the plugin's `metadata()` export and is not
        guaranteed to be unique per build. `sha256` is computed by deckwatch from
        the exact bytes loaded, so it identifies the running binary; compare it with
        `shasum -a 256 plugin.wasm`.
      responses:
        "200":
          description: Loaded plugins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PluginSummary" }
  /api/plugins/{name}/schema:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [Plugins]
      summary: Config schema for a loaded plugin
      responses:
        "200":
          description: Config fields declared by the plugin
          content:
            application/json:
              schema: { type: array, items: { type: object } }
        "404": { description: Plugin not found or not loaded }
  /api/plugins/{name}/config:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Plugins]
      summary: Save plugin config values (Secret-typed fields are encrypted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "204": { description: Saved }
        "404": { description: Plugin not found in settings }
  /api/plugins/{name}/upload:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      tags: [Plugins]
      summary: Upload a WASM binary and reload the plugin from it
      description: |
        Stores the body as `/data/uploads/{name}.wasm`, switches the plugin source
        to `upload`, and reloads it in the background. Once reloaded, the plugin's
        `sha256` in `GET /api/plugins` matches `shasum -a 256` of the uploaded file.
        `{name}` must name a configured plugin and make a plain file name (letters,
        digits, `.`, `_` and `-`, not starting with `.`); nothing is written
        otherwise.

        The upload is other code, so it gets none of the plugin's stored secrets.
        A plugin with a `sha256` pin only takes a binary that matches it, and
        keeps its config. Without a pin, the config values that `GET /api/settings`
        masks are dropped before the new binary can load (`cleared_config_keys`);
        enter them again.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Uploaded; reload started
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256: { type: string, description: Lowercase hex SHA-256 of the stored binary }
                  cleared_config_keys:
                    type: array
                    items: { type: string }
                    description: Config keys whose stored values were dropped
        "400": { description: "Empty body, not a WASM binary, a name that isn't a plain file name, or a binary that doesn't match the plugin's sha256 pin" }
        "404": { description: Plugin not found in settings }

  # -------------------------------------------------------------- registry UI
  /api/registry/enabled:
    get:
      tags: [Registry]
      summary: Whether the embedded OCI registry is enabled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { enabled: { type: boolean } }
  /api/registry/repositories:
    get:
      tags: [Registry]
      summary: List repositories in the embedded registry
      responses: { "200": { description: OK } }
  /api/registry/repositories/{name}/tags:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
        description: Repository name (may contain slashes)
    get:
      tags: [Registry]
      responses: { "200": { description: Tags } }
  /api/registry/repositories/{name}/tags/{tag}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string }
      - in: path
        name: tag
        required: true
        schema: { type: string }
    get:
      tags: [Registry]
      summary: Manifest detail for a tag
      responses: { "200": { description: OK } }
    delete:
      tags: [Registry]
      summary: Delete a tag
      responses: { "204": { description: Deleted } }

  # -------------------------------------------------------------- OCI Distribution
  /v2/:
    get:
      tags: [OCI]
      summary: OCI Distribution Spec v1.1 base endpoint
      responses:
        "200": { description: Registry supports the spec }

  /api/audit:
    get:
      tags: [Audit]
      summary: List audit log rows
      description: |
        Changes made through the UI or REST API (`source=api`), and MCP tool calls
        that wrote, deleted or exec'd, or that a guardrail denied (`source=mcp`).
        Reads that went through are not recorded. Rows are newest first unless
        `order=asc`, in pages linked by `next_cursor`. Every filter matches exactly.

        MCP rows never hold argument values outside mcp-k8s's allowlist (namespace,
        name, kind, image, ...). `client_name` and the client in `detail` are what
        the MCP client said about itself in `initialize`: a label, not an identity.
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [api, mcp] } }
        - name: action
          in: query
          description: "`write`, `delete`, `exec` or `read` for MCP rows; `create`, `update`, `delete`, ... for API rows"
          schema: { type: string }
        - { name: tool, in: query, description: MCP rows, the tool called, schema: { type: string } }
        - { name: client, in: query, description: "MCP rows: the client's self-reported name", schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [ok, error, denied, cancelled] } }
        - { name: resource_type, in: query, schema: { type: string } }
        - { name: namespace, in: query, schema: { type: string } }
        - { name: since, in: query, description: Only rows at or after this time, schema: { type: string, format: date-time } }
        - { name: order, in: query, schema: { type: string, enum: [desc, asc], default: desc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: "`next_cursor` of the previous page", schema: { type: string } }
      responses:
        "200":
          description: One page of audit rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditResponse" }
        "400": { description: Invalid order, cursor or since }
  /api/prometheus/mcp_activity:
    get:
      tags: [MCP, Metrics]
      summary: MCP tool call metrics for the MCP activity page
      description: |
        deckwatch's own MCP metrics (`deckwatch_mcp_tool_calls_total`,
        `mcp_k8s_tool_calls_total` and their duration histograms) from the Prometheus
        at `PROMETHEUS_URL`, through fixed queries. Without Prometheus, or when a
        query fails, the response is 200 with `unavailable_reason` set and no data.
        Sums every deckwatch instance that Prometheus scrapes.
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [1h, 24h, 7d], default: 24h } }
      responses:
        "200":
          description: Series and per-tool totals for the window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpActivityResponse" }
  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics
      responses:
        "200":
          description: text/plain; version=0.0.4
          content:
            text/plain:
              schema: { type: string }

components:
  parameters:
    Namespace:
      in: path
      name: ns
      required: true
      schema: { type: string }
      description: Kubernetes namespace
    Name:
      in: path
      name: name
      required: true
      schema: { type: string }
      description: Resource name

  schemas:
    AuditEntry:
      type: object
      required: [id, timestamp, action, resource_type, resource_name, namespace, detail, user_identity, source, tool, outcome, client_name]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        action: { type: string, description: "MCP rows: write, delete, exec, or read for a denied read" }
        resource_type: { type: string }
        resource_name: { type: string }
        namespace: { type: string }
        detail:
          type: string
          description: |
            Free text for API rows. For MCP rows, JSON (see McpAuditDetail).
        user_identity: { type: string, description: Empty until callers authenticate }
        source: { type: string, enum: [api, mcp] }
        tool: { type: string, description: "MCP rows: the tool called; empty otherwise" }
        outcome: { type: string, description: "MCP rows: ok, error, denied or cancelled; empty otherwise" }
        client_name: { type: string, description: "MCP rows: the client's self-reported name (not an identity)" }
    AuditResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next_cursor: { type: string, nullable: true, description: Pass as `cursor` for the next page }
    McpAuditDetail:
      type: object
      description: The JSON in an MCP audit row's `detail`.
      required: [tool, outcome, argument_keys, arguments, duration_ms]
      properties:
        tool: { type: string }
        outcome: { type: string, enum: [ok, error, denied, cancelled] }
        denied_rule: { type: string, description: "namespace_allowlist, or an mcp-k8s permission rule" }
        argument_keys: { type: array, items: { type: string }, description: "Top-level argument keys; `?` for undeclared ones" }
        arguments:
          type: object
          additionalProperties: true
          description: Only the values mcp-k8s's allowlist permits (namespace, name, kind, image, ...)
        api_version: { type: string }
        client:
          type: object
          properties:
            name: { type: string }
            version: { type: string }
            self_reported: { type: boolean, enum: [true] }
        session_id: { type: string }
        trace_id: { type: string, description: Present when deckwatch exports traces }
        duration_ms: { type: integer }
    TimePoint:
      type: object
      required: [t, v]
      properties:
        t: { type: integer, description: Milliseconds since the epoch }
        v: { type: number }
    LabeledSeries:
      type: object
      required: [label, points]
      properties:
        label: { type: string, description: "The call outcome: ok, error or denied" }
        points: { type: array, items: { $ref: "#/components/schemas/TimePoint" } }
    ToolActivity:
      type: object
      required: [tool, calls, errors, denied]
      properties:
        tool: { type: string }
        calls: { type: number, description: Calls in the window (Prometheus increase, so not always whole) }
        errors: { type: number }
        denied: { type: number }
        p95_seconds: { type: number, nullable: true }
    McpActivityResponse:
      type: object
      required: [window_seconds, step_seconds, calls_per_minute, apply_manifest_per_minute, p95_seconds, tools]
      properties:
        window_seconds: { type: integer }
        step_seconds: { type: integer }
        calls_per_minute: { type: array, items: { $ref: "#/components/schemas/LabeledSeries" } }
        apply_manifest_per_minute: { type: array, items: { $ref: "#/components/schemas/LabeledSeries" } }
        p95_seconds: { type: array, items: { $ref: "#/components/schemas/TimePoint" } }
        tools: { type: array, maxItems: 25, items: { $ref: "#/components/schemas/ToolActivity" } }
        unavailable_reason: { type: string, description: "Set when Prometheus isn't configured or a query failed" }
    Health:
      type: object
      properties:
        status: { type: string, example: ok }

    NamespaceListResponse:
      type: object
      properties:
        namespaces:
          type: array
          items: { type: string }

    CreateNamespaceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }

    CreateNamespaceResponse:
      type: object
      properties:
        name: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        labels:
          type: object
          additionalProperties: { type: string }

    EnvVarInput:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    ResourceSpec:
      type: object
      properties:
        cpu:    { type: string, example: "500m" }
        memory: { type: string, example: "256Mi" }

    ProbeInput:
      type: object
      description: HTTP-GET, exec, or TCP probe. Provide exactly one of `http_get`, `exec`, or `tcp_socket`.
      properties:
        initial_delay_seconds: { type: integer }
        period_seconds:        { type: integer }
        timeout_seconds:       { type: integer }
        failure_threshold:     { type: integer }
        http_get:
          type: object
          properties:
            path: { type: string }
            port: { oneOf: [{ type: integer }, { type: string }] }
        exec:
          type: object
          properties:
            command:
              type: array
              items: { type: string }
        tcp_socket:
          type: object
          properties:
            port: { oneOf: [{ type: integer }, { type: string }] }

    CreateDeploymentRequest:
      type: object
      required: [name, image]
      properties:
        name:     { type: string }
        image:    { type: string }
        replicas: { type: integer, minimum: 0 }
        port:     { type: integer }
        env:
          type: array
          items: { $ref: "#/components/schemas/EnvVarInput" }
        labels:
          type: object
          additionalProperties: { type: string }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        resource_limits:   { $ref: "#/components/schemas/ResourceSpec" }
        resource_requests: { $ref: "#/components/schemas/ResourceSpec" }
        liveness_probe:    { $ref: "#/components/schemas/ProbeInput" }
        readiness_probe:   { $ref: "#/components/schemas/ProbeInput" }
        startup_probe:     { $ref: "#/components/schemas/ProbeInput" }

    UpdateDeploymentRequest:
      type: object
      properties:
        image:    { type: string }
        replicas: { type: integer }
        env:
          type: array
          items: { $ref: "#/components/schemas/EnvVarInput" }
        command: { type: array, items: { type: string } }
        args:    { type: array, items: { type: string } }
        resource_limits:   { $ref: "#/components/schemas/ResourceSpec" }
        resource_requests: { $ref: "#/components/schemas/ResourceSpec" }
        liveness_probe:    { $ref: "#/components/schemas/ProbeInput" }
        readiness_probe:   { $ref: "#/components/schemas/ProbeInput" }
        startup_probe:     { $ref: "#/components/schemas/ProbeInput" }

    DeploymentSummary:
      type: object
      description: Flattened Kubernetes Deployment used by the UI list view.
      properties:
        namespace:   { type: string }
        name:        { type: string }
        image:       { type: string, nullable: true }
        replicas:    { type: integer }
        ready:       { type: integer }
        available:   { type: integer }
        created_at:  { type: string, format: date-time, nullable: true }
        labels:
          type: object
          additionalProperties: { type: string }

    DeploymentListResponse:
      type: object
      properties:
        deployments:
          type: array
          items: { $ref: "#/components/schemas/DeploymentSummary" }

    DeploymentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/DeploymentSummary"
        - type: object
          properties:
            pods:
              type: array
              items: { $ref: "#/components/schemas/PodSummary" }
            ingresses:
              type: array
              items: { $ref: "#/components/schemas/IngressSummary" }

    DeploymentWriteResponse:
      description: A created or updated Deployment, plus what its plugins reported.
      allOf:
        - $ref: "#/components/schemas/DeploymentDetailResponse"
        - type: object
          properties:
            plugin_events:
              type: array
              description: Omitted when no plugin reported anything.
              items: { $ref: "#/components/schemas/PluginEventReport" }

    PluginEventReport:
      type: object
      description: |
        A notice, warning or error from a plugin call: the SDK's `PluginEvent`
        plus the plugin and export that reported it. All text is plugin-supplied
        and untrusted; deckwatch caps it (2 KB per message, 20 events per call),
        strips control characters, puts it on one line and masks the plugin's
        secret config values before returning it. Render it as text only.
      required: [plugin, export, severity, code, message, retryable]
      properties:
        plugin: { type: string, description: Configured plugin name, example: aws }
        export:
          type: string
          description: The call that reported it
          enum: [fetch, metadata, apply, provision, deprovision, validate]
        severity: { type: string, enum: [info, warning, error] }
        code:
          type: string
          description: |
            `<plugin>.<code>` for plugin events. Host codes: `plugin.unspecified`
            (a plugin message without a code, including legacy `errors`,
            `warnings` and `message` strings), `plugin.fetch_failed`,
            `plugin.checksum_mismatch`, `plugin.load_failed`, `plugin.trap`,
            `plugin.timeout`, `plugin.output_invalid`, `plugin.k8s_apply_failed`,
            `plugin.policy_rejected`, and the informational
            `plugin.fields_released`.
          example: aws.assume_role_failed
        message: { type: string }
        resource_id: { type: string, description: The plugin resource id the event is about }
        object: { $ref: "#/components/schemas/KubernetesObjectRef" }
        retryable: { type: boolean, description: Whether retrying unchanged may succeed }
        hint: { type: string, description: A suggested fix }
        trace_id: { type: string, description: Trace id of the call, when deckwatch exports traces }

    KubernetesObjectRef:
      type: object
      description: A Kubernetes object in the application's namespace.
      properties:
        api_version: { type: string, example: v1 }
        kind: { type: string, example: ServiceAccount }
        name: { type: string }

    ProvisionRequest:
      type: object
      properties:
        fields:
          type: object
          additionalProperties: { type: string }
          description: Values for the resource's declared fields

    ProvisionedResource:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string, example: shop/web }
        plugin_name: { type: string }
        resource_id: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
        state: { type: object, additionalProperties: { type: string } }
        annotations: { type: object, additionalProperties: { type: string } }
        sidecars: { type: array, items: { type: object } }
        created_at: { type: string }
        updated_at: { type: string }
        plugin_events:
          type: array
          description: What the plugin reported on this provision or refresh. Omitted in lists.
          items: { $ref: "#/components/schemas/PluginEventReport" }

    DeprovisionResponse:
      type: object
      required: [message, plugin_events, kubernetes_resource_deletions]
      properties:
        message:
          type: string
          description: What the plugin says it did and didn't clean up; empty if nothing.
        plugin_events:
          type: array
          items: { $ref: "#/components/schemas/PluginEventReport" }
        kubernetes_resource_deletions:
          type: array
          description: The objects the plugin's deprovision() asked deckwatch to delete, and what happened to each.
          items:
            type: object
            properties:
              api_version: { type: string }
              kind: { type: string }
              name: { type: string }
              namespace: { type: string }
              outcome: { type: string, enum: [deleted, not_found, refused, failed] }
              reason: { type: string, description: Why it was refused or failed }

    PluginStatus:
      type: object
      required: [namespace, application, plugin, resource_id, health, last_export, last_events, consecutive_failures, last_changed_at, updated_at]
      properties:
        namespace: { type: string, description: Empty for plugin-wide rows }
        application: { type: string, description: Empty for plugin-wide rows }
        plugin: { type: string }
        resource_id: { type: string, description: The plugin resource id; empty for apply() and plugin-wide rows }
        health: { type: string, enum: [healthy, degraded, failing] }
        last_export: { type: string, description: The export of the last recorded call }
        last_events:
          type: array
          description: The latest call's events (at most 10)
          items: { $ref: "#/components/schemas/PluginEventReport" }
        trace_id: { type: string }
        first_failure_at: { type: string, format: date-time, nullable: true, description: When the current run of failures started }
        consecutive_failures: { type: integer }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_changed_at: { type: string, format: date-time, description: When the health last changed }
        updated_at: { type: string, format: date-time }

    PluginFailedError:
      type: object
      required: [error, message, plugin_events]
      properties:
        error: { type: string, enum: [plugin_failed] }
        message: { type: string, description: "The first error, as `code: message`" }
        plugin_events:
          type: array
          items: { $ref: "#/components/schemas/PluginEventReport" }

    PodSummary:
      type: object
      properties:
        namespace: { type: string }
        name:      { type: string }
        phase:     { type: string, example: Running }
        node:      { type: string, nullable: true }
        ready:     { type: boolean }
        restarts:  { type: integer }
        started_at: { type: string, format: date-time, nullable: true }

    PodListResponse:
      type: object
      properties:
        pods:
          type: array
          items: { $ref: "#/components/schemas/PodSummary" }

    IngressSummary:
      type: object
      properties:
        namespace: { type: string }
        name:      { type: string }
        hosts:
          type: array
          items: { type: string }

    GitOpsConfigRequest:
      type: object
      required: [repo_url]
      properties:
        repo_url:         { type: string }
        branch:           { type: string, default: main }
        token_secret:     { type: string, nullable: true }
        dockerfile_path:  { type: string, default: Dockerfile }
        docker_context:   { type: string, default: "." }
        oci_repository:   { type: string, nullable: true, description: "Preferred: OCI-generic destination (e.g. ghcr.io/org/api)" }
        ecr_repository:   { type: string, nullable: true, description: "Deprecated alias for oci_repository" }
        include_paths:    { type: array, items: { type: string } }
        exclude_paths:    { type: array, items: { type: string } }
        poll_interval_seconds: { type: integer }
        webhook_enabled:  { type: boolean }

    GitOpsConfig:
      type: object
      properties:
        repo_url:         { type: string }
        branch:           { type: string }
        token_secret:     { type: string, nullable: true }
        dockerfile_path:  { type: string }
        docker_context:   { type: string }
        oci_repository:   { type: string }
        ecr_repository:   { type: string, description: "Mirror of oci_repository for backwards compat" }
        include_paths:    { type: array, items: { type: string } }
        exclude_paths:    { type: array, items: { type: string } }

    GitOpsStatusResponse:
      type: object
      properties:
        enabled: { type: boolean }
        config:  { $ref: "#/components/schemas/GitOpsConfig", nullable: true }
        last_commit_sha:   { type: string, nullable: true }
        last_build_status: { type: string, nullable: true }
        last_build_job:    { type: string, nullable: true }
        last_build_time:   { type: string, format: date-time, nullable: true }
        last_build_error:  { type: string, nullable: true }

    DeckwatchSettings:
      type: object
      properties:
        allowed_namespaces:
          type: array
          items: { type: string }
        default_resource_limits: { $ref: "#/components/schemas/ResourceSpec" }
        git_repositories:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url:  { type: string }
        oci_registries:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url:  { type: string }
        git_token_secrets:
          type: array
          items:
            type: object
            properties:
              name:        { type: string }
              secret_name: { type: string }
              namespace:   { type: string }
              encrypted_token:
                type: string
                nullable: true
                description: '"configured" when a token is stored; the value is never returned.'
              binding:
                allOf: [{ $ref: "#/components/schemas/EndpointBinding" }]
                nullable: true
                description: GitHub endpoint origins the stored token is bound to. Server-managed.
        credentials:
          allOf: [{ $ref: "#/components/schemas/EncryptedCredentials" }]
          nullable: true
        endpoints:
          allOf: [{ $ref: "#/components/schemas/EndpointSettings" }]
          description: Always present on GET. Omit on PUT to keep the stored endpoints.
        observability:
          allOf: [{ $ref: "#/components/schemas/ObservabilitySettings" }]
          description: Always present on GET. Omit on PUT to keep the stored endpoints.
        mcp_tuning: { $ref: "#/components/schemas/McpTuning" }

    McpTuning:
      type: object
      description: |
        MCP settings: guidance appended to tool descriptions (one string per
        resource group, `global` in the `initialize` instructions), and the
        guardrails of the Kubernetes tools.
      properties:
        global: { type: string }
        namespaces: { type: string }
        deployments: { type: string }
        applications: { type: string }
        gitops: { type: string }
        ingresses: { type: string }
        pods: { type: string }
        secrets: { type: string }
        nodes: { type: string }
        storage: { type: string }
        plugins: { type: string }
        guardrails:
          allOf: [{ $ref: "#/components/schemas/McpGuardrails" }]
          description: Always present on GET. Omit on PUT to keep the stored guardrails.

    McpGuardrails:
      type: object
      description: |
        Guardrails of the embedded mcp-k8s tools, read on every MCP request
        (docs/MCP.md, "Guardrails"). Field names are mcp-k8s's. A missing
        field takes its default.
      properties:
        workload_policy:
          type: string
          enum: [restrictive, permissive]
          default: restrictive
          description: "`permissive` turns every workload guardrail off."
        exceptions:
          type: array
          items:
            type: string
            enum: [allow_privileged, allow_privilege_escalation, allow_host_namespaces, allow_host_path, allow_host_ports, allow_unconfined, allow_node_port, allow_load_balancer, allow_external_services, allow_ingress_snippets, allow_rbac_escalation]
          description: Rules the restrictive policy lets through.
        allowed_custom_resource_groups:
          type: array
          items: { type: string }
          example: ["cert-manager.io"]
          description: >-
            API groups create_custom_resource and update_custom_resource may
            write (`*`: any). Empty refuses custom resource writes. DNS
            subdomains; built-in groups are refused (400).
        allow_privileged_csr:
          type: boolean
          default: false
          description: "approve_csr may approve system:masters and other `system:` identities."
        apply_manifest_enabled:
          type: boolean
          default: true
          description: apply_manifest is listed and served. It bypasses the workload guardrails.
        secret_decode_enabled:
          type: boolean
          default: false
          description: get_secret may return Secret values, and get_resource_json a Secret's data.
        secure_defaults:
          type: boolean
          default: true
          description: The typed create tools fill in runAsNonRoot and the other restricted securityContext defaults.

    ObservabilitySettings:
      type: object
      description: |
        Where deckwatch exports its own telemetry over OTLP/HTTP; "" = not
        set. http:// or https://, no userinfo, query or fragment, at most
        2048 characters. Read at startup: a change applies after a restart.
        An `OTEL_EXPORTER_OTLP_*ENDPOINT` variable wins, per signal.
      properties:
        otlp_endpoint:
          type: string
          description: OTLP/HTTP base URL of a collector, for traces and logs; `/v1/traces` and `/v1/logs` are appended.
          example: "http://otel-collector.observability:4318"
        otlp_metrics_endpoint:
          type: string
          description: Full URL of an OTLP metrics receiver, used as is.
          example: "http://prometheus.monitoring:9090/api/v1/otlp/v1/metrics"

    OtlpSignalExport:
      type: object
      required: [source, endpoint, from, exported, reason]
      properties:
        source:   { type: string, enum: [env, settings, unset] }
        endpoint: { type: string, description: 'Where the signal is sent, credentials masked; "" when unset' }
        from:
          type: string
          nullable: true
          description: The environment variable or setting the endpoint comes from.
          example: observability.otlp_endpoint
        exported: { type: boolean }
        reason:
          type: string
          nullable: true
          description: Why it isn't exported although it has an endpoint.
          example: OTEL_TRACES_EXPORTER=none

    ObservabilityStatus:
      type: object
      required: [signals, restart_required, retired_otlp_endpoint]
      properties:
        signals:
          type: array
          description: Traces, metrics and logs, in that order.
          items:
            type: object
            required: [signal, running, configured]
            properties:
              signal: { type: string, enum: [traces, metrics, logs] }
              running:
                allOf: [{ $ref: "#/components/schemas/OtlpSignalExport" }]
                nullable: true
                description: What deckwatch exports to now, as set up at startup.
              configured:
                allOf: [{ $ref: "#/components/schemas/OtlpSignalExport" }]
                description: What the environment and the saved settings ask for, used from the next start.
        restart_required:
          type: boolean
          description: The saved settings send a signal somewhere other than where it goes now, which takes a restart.
        retired_otlp_endpoint:
          type: object
          nullable: true
          required: [value, message]
          properties:
            value:   { type: string, example: "deckwatch-tempo.deckwatch.svc:4317" }
            message: { type: string }

    EndpointId:
      type: string
      enum: [anthropic_api, vertex_token, vertex_api, bedrock, github_api, github_web, github_raw]

    EndpointSettings:
      type: object
      description: |
        Upstream endpoint overrides; empty = default. https:// only (http:// for
        loopback hosts, or any host when DECKWATCH_ALLOW_INSECURE_ENDPOINTS=true),
        no userinfo, query or fragment. `{region}` may appear in the host of
        `vertex_api_base` and `bedrock_endpoint`.
      properties:
        anthropic_api_base: { type: string, example: "https://api.anthropic.com" }
        vertex_token_url:   { type: string, example: "https://oauth2.googleapis.com/token" }
        vertex_api_base:    { type: string, example: "https://{region}-aiplatform.googleapis.com" }
        bedrock_endpoint:   { type: string, example: "https://bedrock-runtime.{region}.amazonaws.com" }
        github_api_base:    { type: string, example: "https://ghe.example.com/api/v3" }
        github_web_base:    { type: string, example: "https://ghe.example.com" }
        github_raw_base:    { type: string, example: "https://ghe.example.com/raw" }

    EndpointBinding:
      type: object
      description: Endpoint origins (`scheme://host[:port]`) a stored credential may be sent to, recorded when it was saved.
      additionalProperties: { type: string }
      example: { anthropic_api: "https://api.anthropic.com" }

    EncryptedCredentials:
      type: object
      properties:
        anthropic_api_key: { type: string, nullable: true, description: '"configured" when set' }
        gcp_sa_key:        { type: string, nullable: true, description: '"configured" when set' }
        anthropic_api_key_binding: { $ref: "#/components/schemas/EndpointBinding" }
        gcp_sa_key_binding:        { $ref: "#/components/schemas/EndpointBinding" }

    SetCredentialsRequest:
      type: object
      properties:
        anthropic_api_key: { type: string }
        gcp_sa_key:        { type: string }

    SetCredentialsResponse:
      type: object
      properties:
        anthropic_api_key: { type: string, nullable: true }
        gcp_sa_key:        { type: string, nullable: true }
        anthropic_api_key_binding: { $ref: "#/components/schemas/EndpointBinding" }
        gcp_sa_key_binding:        { $ref: "#/components/schemas/EndpointBinding" }

    OutboundStatus:
      type: object
      required: [allow_insecure_endpoints, extra_ca, endpoints, credentials]
      properties:
        allow_insecure_endpoints: { type: boolean }
        extra_ca:
          type: object
          nullable: true
          properties:
            file:         { type: string, example: /etc/deckwatch/extra-ca/ca.crt }
            certificates: { type: integer }
        endpoints:
          type: array
          items:
            type: object
            required: [id, setting, label, default, value, effective, host, error]
            properties:
              id:        { $ref: "#/components/schemas/EndpointId" }
              setting:   { type: string, example: anthropic_api_base }
              label:     { type: string, example: Anthropic API }
              default:   { type: string, example: "https://api.anthropic.com" }
              value:     { type: string, description: 'Configured override ("" = default)' }
              effective: { type: string }
              host:      { type: string, example: api.anthropic.com }
              error:     { type: string, nullable: true }
        credentials:
          type: array
          items:
            type: object
            required: [credential, label, bindings, usable]
            properties:
              credential: { type: string, example: anthropic_api_key }
              label:      { type: string, example: Anthropic API key }
              usable:     { type: boolean }
              bindings:
                type: array
                items:
                  type: object
                  required: [endpoint, bound_host, configured_host, matches]
                  properties:
                    endpoint:        { $ref: "#/components/schemas/EndpointId" }
                    bound_host:      { type: string }
                    configured_host: { type: string }
                    matches:         { type: boolean }

    McpTuningField:
      type: object
      description: >-
        An operator-tunable MCP guidance field declared by a plugin. Values are
        saved in the plugin's `mcp_tuning` settings.
      required: [key, label, description, placeholder]
      properties:
        key:
          type: string
          description: Matched against keys in the plugin's `mcp_tuning` settings.
          example: naming_convention
        label:       { type: string, example: Resource naming convention }
        description: { type: string, description: Help text shown below the field. }
        placeholder: { type: string, description: Example value shown as the input placeholder. }
        default:
          type: string
          description: Value pre-filled in the form. Omitted when the plugin declares none.
    PluginSummary:
      type: object
      description: A WASM plugin currently loaded in memory.
      required: [name, version, description, provides, depends_on, config_schema, resources, mcp_tuning_fields, wasm_size_bytes, sha256, loaded_at]
      properties:
        name:            { type: string, example: aws }
        version:
          type: string
          description: Self-reported by the plugin's `metadata()` export. Empty when the plugin has no `metadata()` export.
          example: "0.7.2"
        description:     { type: string }
        provides:        { type: array, items: { type: string } }
        depends_on:      { type: array, items: { type: string } }
        config_schema:   { type: array, items: { type: object } }
        resources:       { type: array, items: { type: object } }
        mcp_tuning_fields:
          type: array
          description: >-
            MCP tuning fields the plugin declares. Settings → MCP Tuning renders a
            section for each plugin with at least one. Empty when it declares none.
          items: { $ref: "#/components/schemas/McpTuningField" }
        wasm_size_bytes: { type: integer, description: Size of the loaded WASM binary }
        sha256:
          type: string
          description: Lowercase hex SHA-256 of the WASM bytes loaded, computed by deckwatch at load time. Same format as `shasum -a 256`.
          pattern: "^[0-9a-f]{64}$"
          example: 3f1c2e0b9a7d4c5e6f8a1b2c3d4e5f60718293a4b5c6d7e8f9012a3b4c5d6e7f
        loaded_at:
          type: string
          format: date-time
          description: When this binary was loaded into memory (UTC).
          example: "2026-11-24T12:00:00+00:00"
