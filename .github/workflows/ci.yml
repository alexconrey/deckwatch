name: CI

on:
  pull_request:
    branches: [main]
  # Also run on every merge to main. Each PR is tested against main as it was
  # when its CI last ran, so two PRs that pass separately can still break main
  # together; this catches that right after the merge. It also warms the caches
  # PR runs restore from: caches saved on main are readable by every PR.
  push:
    branches: [main]

permissions:
  contents: read

# One run per PR at a time (a new push cancels the outdated run). Runs on main
# are keyed by commit and never cancelled, so every merge gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether Docker Build runs. Every PR already builds what the image
  # contains, each in its own job: the backend (Rust Check, with the toolchain
  # guard below), the frontend (Frontend Build, same Node major through
  # frontend/.nvmrc) and the docs (Docs Build, same pinned mdBook). A PR only
  # needs the image itself when it changes something those jobs can't see:
  #   - the Dockerfile or .dockerignore;
  #   - dependency manifests, since native libraries and musl bindings resolve
  #     inside the image's own base images;
  #   - the toolchain pin or the docs build tooling;
  #   - this workflow, or publish.yml, which builds the release image.
  # Pushes to main always build it, so anything else that breaks the image
  # shows up before a release tag (images are only published from tags).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR checks out GitHub's merge commit. Depth 2 brings its first
          # parent, the base branch tip, so the diff below is the PR's change.
          fetch-depth: 2

      - name: Does this change affect the image build?
        id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          pattern='^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|rust-toolchain\.toml|build\.rs|frontend/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.nvmrc)|scripts/build-docs\.sh|docs/book/book\.toml|\.github/workflows/(ci|publish)\.yml)$'
          if matched=$(grep -E "$pattern" "$RUNNER_TEMP/changed.txt"); then
            echo "Docker Build runs; image-relevant changes:"
            echo "$matched"
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-relevant changes; Docker Build is skipped."
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  rust-check:
    name: Rust Check
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # No debug info for the dev/test profile in CI: faster `cargo test`
      # builds and links, and a much smaller rust-cache. Panic messages still
      # report file:line; only backtraces lose line info.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml is the single source of truth for the toolchain.
      # rustup gives it precedence over `rustup default`, so a separate
      # toolchain-install action only installs a toolchain that cargo then
      # ignores (that is how CI used to build with the runner's preinstalled
      # stable). With no arguments, `rustup toolchain install` (rustup >= 1.28)
      # installs the toolchain, profile and components that file pins.
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install --no-self-update
          rustc --version --verbose
          cargo --version

      # The release image is built by the Dockerfile's rust:<version> stages,
      # so CI must compile with the same rustc minor version.
      - name: Check toolchain matches Dockerfile rust image
        run: |
          want=$(rustc --version | sed -E 's/^rustc ([0-9]+\.[0-9]+).*/\1/')
          images=$(awk 'toupper($1) == "FROM" { for (i = 2; i <= NF; i++) if ($i !~ /^--/) { print $i; break } }' Dockerfile | grep -E '(^|/)rust([:@]|$)' || true)
          if [ -z "$images" ]; then
            echo "::error file=Dockerfile::no rust:<version> build stage found"
            exit 1
          fi
          rc=0
          for image in $images; do
            case "$image" in
              *rust:"$want" | *rust:"$want"[.-]*) echo "ok: $image matches rustc $want" ;;
              *) echo "::error file=Dockerfile::$image does not match rustc $want from rust-toolchain.toml; bump both together"; rc=1 ;;
            esac
          done
          exit "$rc"

      # Restore the cache main saved, but save only from main. Each PR used to
      # save its own (about 1.1 GiB), which filled the repo's 10 GiB Actions
      # cache quota and evicted main's caches, the ones every PR restores.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      # --all-targets type-checks and lints every target, test code included,
      # so a separate `cargo check` step would only repeat this work.
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Tests that need a live cluster are #[ignore]d; run them against one
      # with `cargo test -- --ignored`.
      - name: cargo test
        run: cargo test --locked

      - name: cargo fmt
        run: cargo fmt --check

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # frontend/.nvmrc pins the Node major for CI and local development; the
      # Dockerfile's node:<major> frontend stage must match it.
      - name: Setup Node.js from frontend/.nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: pnpm install
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_INTEGRITY_KEYS: ""

      - name: type check + build
        run: pnpm run build

      - name: type check tests
        run: pnpm run typecheck:test

      - name: unit tests
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The visual baselines in frontend/e2e/__screenshots__ were rendered in
    # this image: same fonts, same Chromium, same rasterization. Its version
    # must equal @playwright/test in frontend/pnpm-lock.yaml (a step below
    # checks that). Bumping Playwright means bumping this tag and
    # frontend's lockfile together, then regenerating the baselines: see
    # docs/TESTING.md.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      # Chromium needs more shared memory than Docker's default 64 MB.
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Check the image matches @playwright/test
        run: |
          want=$(sed -nE "s/^  '@playwright\/test@([0-9][^']*)':\$/\1/p" pnpm-lock.yaml | head -n 1)
          have=$(node -p "JSON.parse(require('fs').readFileSync('/ms-playwright/.docker-info', 'utf8')).driverVersion")
          if [ "$want" != "$have" ]; then
            echo "::error file=.github/workflows/ci.yml::the e2e container is Playwright $have but frontend/pnpm-lock.yaml has @playwright/test $want; bump both together and regenerate the baselines (docs/TESTING.md)"
            exit 1
          fi
          echo "ok: image and @playwright/test are both $want"

      # Only main writes the cache; PRs restore main's. That keeps the
      # repo's cache quota for the Docker and Rust caches.
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-e2e-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-e2e-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Save the pnpm store
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-e2e-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      # Builds the app with `vite build`, serves it with `vite preview`
      # (playwright.config.ts webServer) and runs the functional and visual
      # specs against it with every /api request mocked in the browser.
      - name: Playwright e2e and visual regression
        run: pnpm exec playwright test

      - name: Upload the report, diffs, traces and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same mdBook release and checksum as the Dockerfile's docs stage,
      # read from its ARGs so the two can't drift.
      - name: Install mdBook (pinned, checksum verified)
        run: |
          version=$(sed -n 's/^ARG MDBOOK_VERSION=//p' Dockerfile)
          sha256=$(sed -n 's/^ARG MDBOOK_SHA256_X86_64=//p' Dockerfile)
          if [ -z "$version" ] || [ -z "$sha256" ]; then
            echo "::error file=Dockerfile::ARG MDBOOK_VERSION or MDBOOK_SHA256_X86_64 not found"
            exit 1
          fi
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/${version}/mdbook-${version}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${sha256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/bin" mdbook
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the docs as the image does
        run: |
          mdbook --version
          bash scripts/build-docs.sh --copy
          test -f docs/book/book/index.html

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: helm lint
        run: helm lint helm/deckwatch --set image.repository=test --set image.tag=test

  # publish.yml runs .github/scripts/release-notes.sh and release-on-main.sh
  # on every v* tag and publishes nothing unless both pass. Test each of their
  # refusals here, and check that main could be tagged as it is: the version in Cargo.toml,
  # Chart.yaml (version and appVersion) and frontend/package.json agree, and
  # CHANGELOG.md has a dated, non-empty section for it. A release PR that
  # misses one of these fails here instead of at tag time.
  release-check:
    name: Release Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test release-notes.sh and release-on-main.sh
        run: bash .github/scripts/release-notes-test.sh

      - name: The current version could be released
        run: |
          version=$(awk -F'"' '/^\[/ { p = ($0 == "[package]") } p && /^version *=/ { print $2; exit }' Cargo.toml)
          bash .github/scripts/release-notes.sh "v$version"

  docker-build:
    name: Docker Build
    # Always on pushes to main; on PRs only when `changes` found image-relevant
    # files. A skipped job reports success, so it can still be a required check.
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the release image the way publish.yml does (amd64 only, not
      # pushed). Until now this Dockerfile was only built when a release tag was
      # pushed, so a broken image was found only at release time: a rust: image
      # older than the crates need, or a frontend dependency without a musl
      # native binding for the node:*-alpine stage. The layer cache is written
      # only from main and read by PRs, to stay within the repo's cache quota.
      - name: Build release image (linux/amd64, not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-docker-amd64
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=ci-docker-amd64,mode=max' || '' }}
