{{- if not .Values.encryptionKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deckwatch.fullname" . }}-encryption-key
  labels:
    {{- include "deckwatch.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/compare-options": IgnoreExtraneous
    "argocd.argoproj.io/sync-options": Prune=false
type: Opaque
{{- if .Values.encryptionKey.value }}
data:
  encryption-key: {{ .Values.encryptionKey.value | b64enc | quote }}
{{- else }}
data:
  encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
