apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deckwatch.fullname" . }}
  labels:
    {{- include "deckwatch.labels" . | nindent 4 }}
{{- $outbound := .Values.outbound | default dict }}
{{- $extraCa := $outbound.extraCaBundle | default dict }}
{{- $extraCaKey := $extraCa.key | default "ca.crt" }}
{{- $needsExtraCa := or $extraCa.secretName $extraCa.configMapName }}
{{- if and $extraCa.secretName $extraCa.configMapName }}
{{- fail "outbound.extraCaBundle: set secretName or configMapName, not both" }}
{{- end }}
spec:
  {{- if and .Values.database.persistence.enabled (hasPrefix "sqlite" .Values.database.url) }}
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "deckwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "deckwatch.labels" . | nindent 8 }}
        # The Services select on this too: the bundled tracing backend's pods
        # carry deckwatch's selector labels (with component: tracing-backend),
        # so name + instance alone also matched them. spec.selector stays
        # unchanged because it is immutable.
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "deckwatch.serviceAccountName" . }}
      containers:
        - name: deckwatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DECKWATCH_NAMESPACES
              value: {{ .Values.namespaces | quote }}
            - name: DECKWATCH_PORT
              value: "8080"
            {{- with .Values.logFilter }}
            - name: RUST_LOG
              value: {{ . | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # reportingInstance on the Kubernetes Events deckwatch publishes.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DECKWATCH_SETTINGS_CONFIGMAP
              value: {{ .Values.settings.configMapName | default "deckwatch-config" | quote }}
            - name: DECKWATCH_DATABASE_URL
              {{- if .Values.database.urlFromSecret.enabled }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.urlFromSecret.secretName }}
                  key: {{ .Values.database.urlFromSecret.key }}
              {{- else }}
              value: {{ .Values.database.url | quote }}
              {{- end }}
            - name: DECKWATCH_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.encryptionKey.existingSecret | default (printf "%s-encryption-key" (include "deckwatch.fullname" .)) }}
                  key: encryption-key
            {{- if $needsExtraCa }}
            - name: DECKWATCH_EXTRA_CA_FILE
              value: {{ printf "/etc/deckwatch/extra-ca/%s" $extraCaKey | quote }}
            {{- end }}
            {{- if $outbound.allowInsecureEndpoints }}
            - name: DECKWATCH_ALLOW_INSECURE_ENDPOINTS
              value: "true"
            {{- end }}
            {{- /* deckwatch's own telemetry over OTLP/HTTP (docs/TRACING.md). */}}
            {{- $otlp := (.Values.telemetry | default dict).otlp | default dict }}
            {{- if $otlp.enabled }}
            {{- $bundled := and (not $otlp.endpoint) .Values.tracing.enabled }}
            {{- if not (or $otlp.endpoint $bundled) }}
            {{- fail "telemetry.otlp.enabled needs telemetry.otlp.endpoint, or tracing.enabled to use the bundled backend" }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otlp.endpoint | default (printf "http://%s-%s:4318" (include "deckwatch.fullname" .) (.Values.tracing.backend | default "tempo")) | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            {{- /* The bundled Tempo and Jaeger accept traces only. */}}
            - name: OTEL_TRACES_EXPORTER
              value: {{ ternary "otlp" "none" (ne $otlp.traces false) | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ ternary "otlp" "none" (and (ne $otlp.metrics false) (not $bundled)) | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ ternary "otlp" "none" (and (ne $otlp.logs false) (not $bundled)) | quote }}
            {{- $headers := $otlp.headers | default dict }}
            {{- if $headers.secretName }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ $headers.secretName | quote }}
                  key: {{ $headers.key | default "headers" | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: {{ $otlp.serviceName | default "deckwatch" | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME){{ range $key, $value := $otlp.resourceAttributes }},{{ $key }}={{ $value }}{{ end }}"
            {{- with $otlp.sampler }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ . | quote }}
            {{- end }}
            {{- with $otlp.samplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.registry.enabled }}
            - name: DECKWATCH_REGISTRY_ENABLED
              value: "true"
            - name: DECKWATCH_REGISTRY_STORAGE
              value: {{ .Values.registry.storage | default "filesystem" | quote }}
            {{- if or (eq (default "filesystem" .Values.registry.storage) "filesystem") (not .Values.registry.storage) }}
            - name: DECKWATCH_REGISTRY_ROOT
              value: /data/registry
            {{- end }}
            {{- if eq (default "filesystem" .Values.registry.storage) "s3" }}
            - name: DECKWATCH_REGISTRY_S3_BUCKET
              value: {{ .Values.registry.s3.bucket | quote }}
            - name: DECKWATCH_REGISTRY_S3_PREFIX
              value: {{ .Values.registry.s3.prefix | default "" | quote }}
            - name: DECKWATCH_REGISTRY_S3_REGION
              value: {{ .Values.registry.s3.region | default "us-east-1" | quote }}
            - name: DECKWATCH_REGISTRY_S3_ENDPOINT
              value: {{ .Values.registry.s3.endpoint | default "" | quote }}
            - name: DECKWATCH_REGISTRY_S3_PATH_STYLE
              value: {{ .Values.registry.s3.pathStyle | default false | quote }}
            {{- end }}
            - name: DECKWATCH_REGISTRY_PUBLIC_URL
              value: {{ include "deckwatch.registryPublicUrl" . | quote }}
            {{- if .Values.registry.internalUrl }}
            - name: DECKWATCH_REGISTRY_INTERNAL_URL
              value: {{ .Values.registry.internalUrl | quote }}
            {{- end }}
            {{- end }}
          {{- if and .Values.registry.enabled (eq (default "filesystem" .Values.registry.storage) "s3") .Values.registry.s3.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.registry.s3.credentialsSecret | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- $needsRegistryVol := and .Values.registry.enabled (or (eq (default "filesystem" .Values.registry.storage) "filesystem") (not .Values.registry.storage)) }}
          {{- $needsDbVol := and .Values.database.persistence.enabled (hasPrefix "sqlite" .Values.database.url) }}
          {{- if or $needsRegistryVol $needsDbVol $needsExtraCa }}
          volumeMounts:
            {{- if $needsRegistryVol }}
            - name: registry-storage
              mountPath: /data/registry
            {{- end }}
            {{- if $needsDbVol }}
            - name: db-storage
              mountPath: /data
            {{- end }}
            {{- if $needsExtraCa }}
            - name: extra-ca
              mountPath: /etc/deckwatch/extra-ca
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $needsRegistryVol $needsDbVol $needsExtraCa }}
      volumes:
        {{- if $needsRegistryVol }}
        - name: registry-storage
          persistentVolumeClaim:
            claimName: {{ include "deckwatch.fullname" . }}-registry
        {{- end }}
        {{- if $needsDbVol }}
        - name: db-storage
          persistentVolumeClaim:
            claimName: {{ include "deckwatch.fullname" . }}-db
        {{- end }}
        {{- if $needsExtraCa }}
        # Only the bundle key is projected, so a missing key fails the pod
        # instead of starting without the CA.
        - name: extra-ca
          {{- if $extraCa.secretName }}
          secret:
            secretName: {{ $extraCa.secretName | quote }}
          {{- else }}
          configMap:
            name: {{ $extraCa.configMapName | quote }}
          {{- end }}
            items:
              - key: {{ $extraCaKey | quote }}
                path: {{ $extraCaKey | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
