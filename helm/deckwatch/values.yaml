replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Comma-separated list of namespaces deckwatch is allowed to manage.
# Empty string = all namespaces.
namespaces: ""

# Log filter, passed to deckwatch as RUST_LOG (tracing EnvFilter syntax, for
# example "deckwatch=debug,tower_http=info"). Empty uses the built-in default,
# "deckwatch=info,tower_http=info,mcp_k8s=info,extism::pdk=info,opentelemetry=warn":
# deckwatch, HTTP responses, the embedded mcp-k8s library, plugin log lines,
# and OTLP export failures (see telemetry.otlp).
logFilter: ""

service:
  type: ClusterIP
  port: 80
  # Annotations applied to the Service. When metrics.annotations is enabled
  # below, Prometheus scrape hints are merged in.
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: deckwatch.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Extra environment variables for the deckwatch container: a list of
# Kubernetes EnvVar objects (name, plus value or valueFrom), added after the
# ones the chart sets. Don't repeat a name the chart sets; use the chart's
# value for it instead (logFilter for RUST_LOG, for example), because a
# duplicate name fails server-side apply. Values are strings, so quote
# numbers.
#
# TOKIO_WORKER_THREADS sets how many async worker threads deckwatch runs. The
# default is one per CPU the container may use, and a CPU limit counts in
# whole cores, rounded down, with a minimum of one: any limit under 2 cores,
# such as the 200m above, gives one worker. Plugin calls currently hold a
# worker for as long as they run, HTTP requests included (#385), and while
# the only worker is busy, deckwatch answers nothing, health checks included.
# More workers don't raise the CPU limit, but they keep deckwatch answering
# while a plugin waits on the network. Use a positive integer; deckwatch
# doesn't start with anything else.
extraEnv: []
#   - name: TOKIO_WORKER_THREADS
#     value: "4"

# Probes for the deckwatch container. Each is a Kubernetes Probe object,
# passed to the container unchanged. Helm merges your values into the
# defaults below, so to switch a probe to another handler (exec, tcpSocket,
# grpc), also set httpGet: null. To remove a probe, set it to null ({} keeps
# the defaults).
#
# deckwatch fetches and compiles every enabled plugin before it starts
# serving HTTP. Kubernetes runs the liveness and readiness probes only after
# the startup probe succeeds, so neither has an initial delay, and the
# startup probe sets how long deckwatch has to start: 5 minutes (60 checks,
# 5 s apart). Raise its failureThreshold if loading your plugins takes
# longer; plugins load one at a time, and each download can take up to 30 s.
# Without a startup probe, give livenessProbe an initialDelaySeconds that
# covers startup.
#
# /api/healthz answers whenever the HTTP server is up; a liveness failure
# restarts the container. /api/readyz also checks that deckwatch can reach
# the Kubernetes API; a readiness failure takes the pod out of the Service
# until it passes again. Both wait 5 s for an answer, rather than Kubernetes'
# default of 1 s, so a few slow answers from a busy pod don't restart it or
# take it out of the Service.
livenessProbe:
  httpGet:
    path: /api/healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/healthz
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60

# deckwatch's cache directory: an emptyDir mounted at mountPath and passed to
# deckwatch as DECKWATCH_CACHE_DIR. Every plugin call compiles the plugin's
# WebAssembly; with the cache, each plugin binary is compiled once and the
# result reused (from <mountPath>/wasmtime). Each pod has its own cache, so
# replicas share no volume, and it lasts as long as the pod, container
# restarts included. Disabled, plugins are compiled on every call. If
# deckwatch can't use the directory, it logs a warning and runs without the
# cache; the cache never makes a plugin call fail.
cache:
  enabled: true
  mountPath: /var/cache/deckwatch
  # The emptyDir's size limit; Kubernetes evicts the pod if the cache grows
  # past it. wasmtime trims its cache to stay under 512 MiB, checking at most
  # hourly, so keep the limit well above that. Empty means no limit.
  sizeLimit: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  # Prometheus text-format exposition is served at /metrics on the same
  # container port as the app (8080). No auth is required.
  enabled: true

  # Adds prometheus.io/* scrape hints to the Service. Leave enabled if your
  # Prometheus is configured with the classic kubernetes_sd_configs job that
  # respects those annotations. Disable when relying on ServiceMonitor.
  annotations: true

  # Emit a prometheus-operator ServiceMonitor resource. Requires the
  # monitoring.coreos.com/v1 CRDs to be installed in the cluster.
  serviceMonitor:
    enabled: false
    # Namespace the ServiceMonitor is deployed into. Defaults to the release
    # namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels required by your Prometheus operator's serviceMonitorSelector.
    labels: {}
    # Metric relabeling applied at scrape time.
    metricRelabelings: []
    relabelings: []

settings:
  configMapName: "deckwatch-config"
  defaults:
    allowed_namespaces: []
    auth:
      enabled: false
      tenant_id: ""
      client_id: ""
    notifications:
      enabled: false
      webhook_url: ""
    default_resource_limits: null
    git_repositories: []
    oci_registries: []
    git_token_secrets: []

registry:
  enabled: false

  # Storage backend: "filesystem" (default, PVC-backed) or "s3".
  # Filesystem uses the storageSize/storageClassName/accessMode fields below
  # to provision a PVC. S3 skips the PVC entirely and reads the `s3` block.
  storage: filesystem

  # Only used when storage=filesystem.
  storageSize: 10Gi
  storageClassName: ""
  accessMode: ReadWriteOnce

  # Only used when storage=s3.
  s3:
    bucket: ""
    prefix: ""
    region: "us-east-1"
    # Custom endpoint for MinIO / Ceph RGW / R2. Empty = AWS default.
    endpoint: ""
    # Force path-style addressing. Auto-enabled when `endpoint` is set.
    pathStyle: false

    # Credentials. Prefer IRSA on EKS:
    #   serviceAccount.annotations["eks.amazonaws.com/role-arn"] = <role>
    # Otherwise set `credentialsSecret` to the name of an existing Secret
    # containing AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / (optional)
    # AWS_SESSION_TOKEN keys. Values are wired in via `envFrom.secretRef`.
    credentialsSecret: ""

  service:
    port: 5000
  publicUrl: ""
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: ""
    tls: []

webhook:
  enabled: false

prometheus:
  enabled: true

tracing:
  enabled: false

# Outbound HTTPS from deckwatch: AI providers, GitHub and other git hosts,
# plugin downloads, notification webhooks, Prometheus, tracing, S3.
# See docs/TLS.md.
outbound:
  # Extra CA certificates trusted in addition to the system roots (a private
  # CA, or a TLS-inspecting proxy's CA). The PEM bundle under `key` is mounted
  # read-only and passed to deckwatch as DECKWATCH_EXTRA_CA_FILE. Set
  # secretName or configMapName, not both. A missing key, or a bundle that is
  # unreadable or not PEM certificates, stops the pod at startup.
  extraCaBundle:
    secretName: ""
    configMapName: ""
    key: ca.crt
  # Accept http:// endpoints for any host. Local development and tests only;
  # http:// to localhost is always accepted. Sets
  # DECKWATCH_ALLOW_INSECURE_ENDPOINTS=true.
  allowInsecureEndpoints: false

# deckwatch's own telemetry: the traces, log lines and metrics of deckwatch
# itself, including the embedded mcp-k8s library and plugin log lines,
# exported over OTLP/HTTP (http/protobuf). Off by default. Not to be confused
# with the `tracing` block above, which runs a backend for your workloads'
# traces. Export uses the outbound TLS settings, so outbound.extraCaBundle
# applies. See docs/TRACING.md, "deckwatch's own telemetry".
telemetry:
  otlp:
    enabled: false
    # OTLP/HTTP base URL (OTEL_EXPORTER_OTLP_ENDPOINT); deckwatch appends
    # /v1/traces, /v1/logs and /v1/metrics. For example
    # http://otel-collector.observability:4318. Empty with tracing.enabled
    # sends traces to the bundled backend (metrics and logs are then off).
    endpoint: ""
    # Exporter headers, usually credentials (OTEL_EXPORTER_OTLP_HEADERS,
    # "name=value,name2=value2"), from a key of an existing Secret.
    headers:
      secretName: ""
      key: headers
    # Signals to export. A backend that accepts only traces needs metrics and
    # logs off; deckwatch then attaches its log lines to spans as span events.
    traces: true
    metrics: true
    logs: true
    # OTEL_SERVICE_NAME.
    serviceName: deckwatch
    # Extra OTEL_RESOURCE_ATTRIBUTES, as key: value (no commas or "=" in
    # values). k8s.namespace.name and k8s.pod.name are always set.
    resourceAttributes: {}
    # OTEL_TRACES_SAMPLER and OTEL_TRACES_SAMPLER_ARG, for example
    # parentbased_traceidratio and "0.25". Empty means parentbased_always_on.
    sampler: ""
    samplerArg: ""

encryptionKey:
  # Use an existing Secret for the encryption key instead of generating one.
  # Set to the Secret name; it must contain a key named "encryption-key".
  existingSecret: ""
  # Provide a stable encryption key value directly. Takes precedence over
  # random generation. Required when deploying via ArgoCD (lookup is
  # unavailable in server-side rendering, causing key regeneration on sync).
  value: ""

database:
  # Database URL. SQLite for dev, Postgres/MySQL for production.
  # Examples:
  #   sqlite:///data/deckwatch.db?mode=rwc
  #   postgres://user:pass@host:5432/deckwatch
  url: "sqlite:///data/deckwatch.db?mode=rwc"
  # Read DECKWATCH_DATABASE_URL from a K8s Secret instead of the plaintext
  # url above. The Secret can be created by any mechanism — ExternalSecrets
  # Operator, Secrets Store CSI, Vault, or plain kubectl create secret.
  urlFromSecret:
    enabled: false
    secretName: ""
    key: "database-url"
  # PVC for SQLite persistence. Only used when url starts with "sqlite://".
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Audit log retention. The audit log records every change made through the
# UI or API, and every MCP tool call that writes, deletes or execs, or that a
# guardrail denied. Rows past either limit are pruned hourly; 0 turns a limit
# off. Set here rather than in Settings so the settings API can't shorten
# the audit trail.
audit:
  retentionDays: 365
  maxRows: 100000

templates:
  configMapName: "deckwatch-templates"
  overrides: []

# Extra Kubernetes resources to create alongside deckwatch. Each entry
# is rendered as a standalone manifest. Use this for environment-specific
# resources like ExternalSecrets, NetworkPolicies, etc. without modifying
# the chart itself.
extraResources: []
