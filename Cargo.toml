[package]
name = "deckwatch"
version = "0.6.7"
edition = "2021"
publish = false

# The server is a library plus a thin binary (src/main.rs calls
# deckwatch::run) so integration tests in tests/ can call real code paths.
[lib]
path = "src/lib.rs"
# Doc comments are prose, not examples.
doctest = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "compression-gzip", "trace"] }

kube = { version = "5", features = ["ws"] }
# deckwatch is the binary, so it picks the Kubernetes API version (k8s-openapi
# allows exactly one `v1_*` feature per build; libraries such as mcp-k8s don't
# set one). v1_33 is the oldest k8s-openapi 0.29 offers, so deckwatch supports
# Kubernetes >= 1.33 (Zeus runs 1.35). Raising it raises that floor.
k8s-openapi = { version = "0.29", features = ["v1_33"] }
# default-features = false: deckwatch only uses the mcp_k8s library, not the
# standalone server binary (and its utoipa-swagger-ui / zip build dependencies).
# kube and k8s-openapi must match mcp-k8s's: deckwatch passes its kube::Client in.
mcp-k8s = { git = "https://github.com/alexconrey/mcp-k8s.git", tag = "v0.5.1", default-features = false }
rustls = { version = "0.23", features = ["ring"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Error paths (e.g. `env_vars[2].name`) when plugin output fails to parse.
# Already in the dependency tree through axum.
serde_path_to_error = "0.1"

thiserror = "2"
futures = "0.3"
tokio-stream = "0.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# deckwatch's own telemetry (src/telemetry.rs): OTLP/HTTP export of the spans,
# events and metric events it emits through `tracing`. Off unless an
# OTEL_EXPORTER_OTLP_*ENDPOINT is set. No HTTP-client features: export goes
# through the shared outbound client (src/outbound), so it gets the extra CAs.
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "gzip-http", "trace", "metrics", "logs", "internal-logs"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"

clap = { version = "4", features = ["derive", "env"] }
jiff = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
base64 = "0.23"
anyhow = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
jsonwebtoken = { version = "12", features = ["rust_crypto"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", features = ["io"] }
hmac = "0.13"
subtle = "2"
async-trait = "0.1"

# Cloud-agnostic object storage trait — S3 backend for the embedded OCI
# registry. See docs/S3_REGISTRY.md for the rationale; the `aws` feature
# pulls in the standard AWS credential chain (env, IMDS, IRSA, EKS Pod
# Identity), reqwest 0.13 over rustls (system trust store; TLS uses the ring
# provider installed in main()) and aws-lc-rs for SigV4 signing (aws-lc-rs
# is already compiled in via rustls' default features).
object_store = { version = "0.14", features = ["aws"] }
bytes = "1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rcgen = "0.14"
time = "0.3"

# Database layer — SeaORM supports SQLite / PostgreSQL / MySQL from a single
# codebase. runtime-tokio-rustls matches our existing tokio + rustls stack.
sea-orm = { version = "1", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "1" }

# AES-256-GCM for encrypting API keys stored in the database.
aes-gcm = "0.11"
rand = "0.10"

# WASM plugin host — executes external plugins fetched from Git repos.
extism = "1.41"

[dev-dependencies]
tempfile = "3"
# In-memory span, log and metric exporters for src/telemetry_tests.rs.
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["testing"] }
# TLS mock upstreams in tests/outbound_tls.rs. Already in the lockfile via
# kube and reqwest 0.13.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# RSA key generation for the Vertex AI service-account test (ring cannot
# generate RSA keys). Already compiled in through rustls' default features;
# no default features so no new crates enter the lockfile.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "alloc"] }
# Parses the webhook CA/serving certs in webhook_tls tests. Already in the
# lockfile via rcgen's optional x509-parser dependency.
x509-parser = { version = "0.18", features = ["verify"] }
